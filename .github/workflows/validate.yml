name: Validate proposal

# Three jobs. Make all three required checks on main:
#
#   submission-rules  a contributor's PR may only add or edit ONE file,
#                     proposals/<their-login>/<task-name>.yaml — nothing else.
#   proposal-file     the YAML is valid and complete (and the test suite passes).
#   data-can-run      the proposal's datasets load from the Hub the way a
#                     miner's dataloader loads them.
#
# A fourth, subnet-contract, loads every proposal's exported config through the
# subnet's own config classes (Connito-AI/Connito, master). It is NOT meant to
# be required: when it fails, the subnet changed and export needs updating —
# nothing a proposer can fix. So it runs on maintainers' PRs (the ones that
# can change export), on pushes to main, weekly and by hand — and is skipped
# on contributors' proposal PRs, where a red X would only confuse them.
#
# submission-rules and data-can-run run the checker from the BASE branch
# against the files from the PR, so a PR cannot change the code that judges
# it. (proposal-file runs the PR's own code, which is safe only because
# submission-rules fails any contributor PR that touches that code.)
#
# Plain `pull_request` (not `pull_request_target`): the token is read-only and
# no secrets reach code from forks. Reports go to the job summary, which shows
# on the PR's checks tab without any write permission.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays; only subnet-contract runs
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Logins treated as maintainers whatever GitHub's author_association says:
  # an App opening PRs shows as NONE, and an org member with private
  # membership can show as CONTRIBUTOR. Add yours here if that is you.
  # Keep in step with subnet-contract's `if` below.
  TRUSTED_AUTHORS: "connito-client-dev[bot]"

jobs:
  submission-rules:
    name: submission-rules
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checker (from the base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: tool
      - name: Pull request files
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ./tool
      - name: Only proposals/<author>/<task>.yaml may change
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # From RUNNER_TEMP, so `python -m` imports the installed base-branch
          # checker rather than an expert_hunter/ the PR might carry.
          cd "$RUNNER_TEMP"
          # Only for the one PR that introduces this check: its base has no
          # checker yet. The base branch is maintainer-controlled, so this
          # cannot be triggered by a contributor.
          if ! python -c "import expert_hunter.submission" 2>/dev/null; then
            echo "The base branch predates the submission check; nothing to run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m expert_hunter.submission --author "$AUTHOR" --association "$ASSOCIATION" \
            --base "$BASE" --repo "$GITHUB_WORKSPACE/pr" --trusted "$TRUSTED_AUTHORS" \
            --report "$GITHUB_STEP_SUMMARY"
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "Push to main; submission rules apply to pull requests only." >> "$GITHUB_STEP_SUMMARY"

  proposal-file:
    name: proposal-file
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Schema check of every proposal
        run: python -m expert_hunter.check
      - name: Tests
        run: pytest

  data-can-run:
    name: data-can-run
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checker (from the base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: tool
      - name: Proposal (from the pull request)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "./tool[network]"
      - name: Find the proposals this PR adds or changes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cd pr
          if [ -n "$BASE" ]; then
            files=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD \
                    | grep -E '^proposals/[^/]+/[^/]+\.yaml$' | tr '\n' ' ' || true)
          else
            # On main (or a manual run): re-check every worked example, so a
            # dataset that disappears or goes gated is noticed here rather than
            # in someone's first pull request.
            files=$(ls examples/*/*.yaml | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Proposals to check: ${files:-none}"
      - name: Load the data the way a miner would
        if: steps.changed.outputs.files != ''
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          args=""
          for f in ${{ steps.changed.outputs.files }}; do args="$args $PWD/pr/$f"; done
          # Run from RUNNER_TEMP, not from pr/: `python -m` puts the working
          # directory first on sys.path, so running inside pr/ would import the
          # PR's own expert_hunter/ instead of the installed base-branch checker.
          cd "$RUNNER_TEMP"
          python -m expert_hunter.check $args --network --report "$RUNNER_TEMP/report.md" \
            || status=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      - name: Nothing to check
        if: steps.changed.outputs.files == ''
        run: echo "This PR adds no proposal; nothing to load." >> "$GITHUB_STEP_SUMMARY"

  subnet-contract:
    name: subnet-contract
    # Same maintainer test as expert_hunter.submission.is_maintainer. A job's
    # `if` cannot read `env`, so the TRUSTED_AUTHORS logins are repeated here.
    if: >-
      github.event_name != 'pull_request'
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      || github.event.pull_request.user.login == 'connito-client-dev[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The subnet's config classes (Connito-AI/Connito, default branch)
        uses: actions/checkout@v4
        with:
          repository: Connito-AI/Connito
          path: subnet
          sparse-checkout: connito/shared/config.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test]"
      - name: Every exported proposal loads in the subnet
        env:
          CONNITO_SUBNET: ${{ github.workspace }}/subnet
        run: |
          echo "Subnet at $(git -C subnet rev-parse --short HEAD)"
          pytest tests/test_subnet_contract.py -v -rs
