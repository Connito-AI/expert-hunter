name: Leaderboard

# Regenerates LEADERBOARD.md from the open proposal PRs: 👍 on the PR is a
# vote, and only PRs whose `data-can-run` check passed are ranked. Runs on a
# schedule rather than on every reaction, because GitHub fires no event for a
# reaction.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: leaderboard
  cancel-in-progress: false

permissions:
  contents: write        # commit LEADERBOARD.md
  pull-requests: read
  issues: read
  checks: read

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Rank open proposals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m expert_hunter.leaderboard LEADERBOARD.md
      - name: Commit if it changed
        run: |
          # The timestamp line always changes; commit only when the ranking did.
          if git diff --quiet -I '^_Updated ' -- LEADERBOARD.md; then
            echo "ranking unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git commit -m "leaderboard: update ranking"
          git push
