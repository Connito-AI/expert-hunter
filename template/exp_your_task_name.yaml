# The proposal template. Copy it (don't start from scratch) to
#   proposals/<your-github-login>/exp_<task_name>.yaml
# fill in the fields below, and open a pull request with that one file.
# doc/GUIDE.md walks through it.

# exp_ + lowercase words joined with underscores. Same as the file name.
name: exp_your_task_name

# One line: what the expert gets good at. Also your pull request title.
title: What the expert gets good at

proposer:
  github: your-github-login       # the same as your folder name
  contact: null                   # optional: Discord handle, email, or hotkey

# A sentence or two: what is trained, on which dataset, to improve which
# benchmark. For example: "Train an expert on SEC filings to improve FinQA."
description: >
  ...

data:
  # What to train on: HuggingFace datasets, weights adding up to 1.0 (up to four).
  dataset_sources:
    - path: org/dataset-name      # the HuggingFace dataset id
      name: null                  # the dataset's config/subset, if it has several
      split: train
      weight: 0.5
      text_column: text           # the column holding the text; or instead, for
                                  # a question/answer dataset, join columns:
                                  # text_template: "User: {question}\n\nAssistant: {answer}"
      license: null               # e.g. cc-by-4.0

    # General web text, so the expert doesn't forget everything else. Recommended.
    - path: allenai/c4
      name: en
      split: train
      weight: 0.5
      text_column: text
      license: odc-by

  sequence_length: 4096           # 1024, 2048 or 4096

# What should improve. At least one benchmark; up to five.
benchmarks:
  - name: my_benchmark            # a short label
    harness: lm_eval              # lm_eval (preferred) or eval_loss
    task: my_lm_eval_task         # the lm-evaluation-harness task name
    num_fewshot: 0                # the few-shot count the benchmark is usually reported with
    metric: acc                   # the number to read, as lm-eval names it
    higher_is_better: true
    dataset:                      # where the benchmark's questions live
      path: org/benchmark-dataset
      name: null
      split: test

# A few sentences: why should training on this data improve this benchmark?
hypothesis: >
  ...

# Any research, paper or result suggesting it works? "none known" is fine.
evidence: >
  ...

# Optional: your guess at how long to train and with what batch size.
# The owner decides; leave these out if you have no idea.
suggested_training:
  steps: null
  batch_size: null

# One line: how you know the benchmark's questions are not in the training data.
contamination: >
  ...
