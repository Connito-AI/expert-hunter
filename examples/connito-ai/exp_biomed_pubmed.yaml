# A worked example, not a live proposal: it lives under examples/, not
# proposals/, so it is never up for a vote. CI checks it like a real one, so it
# stays valid.
#
# Modelled on the experiment repo's p4-biomed-cpt row (PubMed abstracts plus
# a c4 replay stream) and its medical benchmarks.
name: exp_biomed_pubmed
title: Biomedical literature expert (PubMed + c4)

proposer:
  github: connito-ai
  contact: null

description: >
  Train an expert on PubMed titles and abstracts, mixed half and half with
  general web text, to improve the medical exams MedQA and MedMCQA.

data:
  dataset_sources:
    # MedRAG/pubmed rather than ncbi/pubmed: the official mirror ships a loading
    # script that current `datasets` refuses to run. `contents` is title +
    # abstract; `content` would drop the title.
    - path: MedRAG/pubmed
      split: train
      weight: 0.5
      text_column: contents
      license: nlm-terms
    # Replay: the standard defence against forgetting in domain training.
    - path: allenai/c4
      name: en
      split: train
      weight: 0.5
      text_column: text
      license: odc-by

benchmarks:
  - name: medqa
    harness: lm_eval
    task: medqa_4options
    num_fewshot: 0
    metric: acc_norm
    higher_is_better: true
    dataset:
      path: GBaker/MedQA-USMLE-4-options
      split: test
    why: >
      US medical licensing exam questions: tests applying biomedical knowledge,
      not just recognising abstract text.

  - name: medmcqa
    harness: lm_eval
    task: medmcqa
    num_fewshot: 0
    metric: acc_norm
    higher_is_better: true
    dataset:
      path: openlifescienceai/medmcqa
      split: validation
    why: >
      Indian medical entrance exam questions across 21 subjects; a second,
      independent exam so one benchmark's quirks do not decide the result.

hypothesis: >
  PubMed abstracts are where the knowledge both exams test is written down:
  drug mechanisms, how diseases present, which treatments work. The exams ask
  the model to recall and apply exactly that.

evidence: >
  PMC-LLaMA (Wu et al., 2023) and MEDITRON (Chen et al., 2023) both continued
  pre-training general models on biomedical literature and reported higher
  MedQA scores.

contamination: >
  Neither benchmark is built from PubMed abstracts: both are exam questions
  written by examiners. c4 is a 2019 web crawl; MedQA and MedMCQA test items
  are not known to appear in it, and the scored splits are never trained on.
